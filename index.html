<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="NOVA - Modern apparel & accessories storefront" />
  <title>NOVA | Modern Store</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif']
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>

<body class="bg-[#0f1117] text-slate-100 antialiased font-sans min-h-screen bg-grid-pattern">

  <!-- Navigation Header -->
  <header class="sticky top-0 z-40 w-full border-b border-white/10 bg-[#0f1117]/80 backdrop-blur-lg">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">

      <!-- Brand Logo -->
      <a href="#shop" class="flex items-center gap-2 text-2xl font-bold font-display tracking-wider">
        <span>NOVA</span>
        <span class="h-2 w-2 rounded-full bg-violet-500"></span>
      </a>

      <!-- Search Bar -->
      <div class="relative hidden md:block w-72">
        <span class="absolute inset-y-0 left-3 flex items-center text-slate-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </span>
        <input type="text" id="search-input" placeholder="Search products..."
          class="w-full rounded-full border border-white/10 bg-white/5 py-2 pl-9 pr-4 text-sm text-slate-200 placeholder-slate-400 focus:border-violet-500 focus:outline-none focus:ring-1 focus:ring-violet-500 transition" />
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-3">
        <button id="wishlist-nav-btn"
          class="relative flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-4 py-2 text-sm font-medium text-slate-300 hover:bg-white/10 transition">
          <svg class="w-4 h-4 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
              d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
          </svg>
          <span class="hidden sm:inline">Wishlist</span>
          <span id="wishlist-count"
            class="ml-1 hidden rounded-full bg-rose-500/20 px-2 py-0.5 text-xs text-rose-300 font-semibold">0</span>
        </button>

        <button id="cart-nav-btn"
          class="flex items-center gap-2 rounded-full bg-violet-600 px-4 py-2 text-sm font-semibold text-white hover:bg-violet-500 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
              d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
          </svg>
          <span>Cart</span>
          <span id="cart-count"
            class="hidden rounded-full bg-white px-2 py-0.5 text-xs font-bold text-violet-900">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">

    <!-- Hero Section -->
    <section id="shop" class="py-6">
      <div class="flex flex-col md:flex-row md:items-end justify-between gap-6">
        <div>
          <span class="text-xs font-semibold uppercase tracking-widest text-violet-400">
            Spring / Summer Drop
          </span>
          <h1 class="mt-2 font-display text-4xl font-bold tracking-tight text-white sm:text-5xl">
            Modern Apparel Store
          </h1>
          <p class="mt-3 text-sm text-slate-400 max-w-md">
            Carefully crafted everyday apparel and accessories built for comfort and timeless modern style.
          </p>
        </div>

        <div id="category-filters" class="flex flex-wrap gap-2">
        </div>
      </div>
    </section>

    <section class="mt-8">
      <div id="product-grid" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
      </div>
    </section>

    <section id="cart" class="mt-20">
      <div class="mb-6 flex flex-wrap items-center justify-between gap-4 border-b border-white/10 pb-4">
        <h2 id="section-title" class="font-display text-2xl font-bold text-white">Your Cart</h2>

        <div class="flex rounded-xl border border-white/10 bg-white/5 p-1 text-xs">
          <button id="tab-cart-btn" class="rounded-lg px-4 py-2 font-medium bg-violet-600 text-white transition">
            Cart (<span id="tab-cart-count">0</span>)
          </button>
          <button id="tab-wishlist-btn"
            class="rounded-lg px-4 py-2 font-medium text-slate-400 hover:text-white transition">
            Wishlist (<span id="tab-wishlist-count">0</span>)
          </button>
        </div>
      </div>

      <div id="cart-view" class="glass-card rounded-2xl p-6">
      </div>

      <div id="wishlist-view" class="glass-card rounded-2xl p-6 hidden">
      </div>
    </section>
  </main>

  <footer class="mt-20 border-t border-white/10 bg-[#0c0e14] py-8 text-center text-xs text-slate-500">
    <div class="mx-auto max-w-7xl px-4">
      <p>© <span id="current-year"></span> NOVA Storefront. All rights reserved.</p>
    </div>
  </footer>

  <div id="detail-modal" class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center p-4 hidden">
    <div class="glass-card relative grid max-h-[90vh] w-full max-w-3xl overflow-hidden rounded-3xl md:grid-cols-2">
      <button id="modal-close-btn"
        class="absolute right-4 top-4 z-10 rounded-full border border-white/10 bg-black/40 p-2 text-slate-400 hover:text-white backdrop-blur-md transition"
        aria-label="Close modal">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <div class="relative h-64 md:h-full bg-slate-900">
        <img id="modal-image" src="" alt="" class="h-full w-full object-cover" />
      </div>

      <div class="flex flex-col justify-between p-6 sm:p-8">
        <div>
          <span id="modal-category" class="text-xs font-semibold uppercase tracking-wider text-violet-400"></span>
          <h2 id="modal-name" class="mt-2 font-display text-2xl font-bold text-white sm:text-3xl"></h2>
          <div class="mt-3 flex items-center gap-3">
            <span id="modal-price" class="text-2xl font-bold text-white"></span>
            <span class="flex items-center gap-1 text-sm text-slate-300">
              <svg class="w-4 h-4 text-amber-400" fill="currentColor" viewBox="0 0 20 20">
                <path
                  d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
              </svg>
              <span id="modal-rating"></span>
            </span>
          </div>

          <p id="modal-description" class="mt-4 text-sm leading-relaxed text-slate-300"></p>
        </div>

        <div class="mt-8 pt-6 border-t border-white/10">
          <div class="flex items-center gap-3">
            <button id="modal-wishlist-btn"
              class="flex h-12 w-12 items-center justify-center rounded-xl border border-white/10 bg-white/5 text-slate-300 hover:bg-white/10 transition"
              aria-label="Wishlist">
              <svg id="modal-wishlist-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                  d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
              </svg>
            </button>

            <button id="modal-add-cart-btn"
              class="flex flex-1 items-center justify-center gap-2 rounded-xl bg-violet-600 py-3.5 text-sm font-semibold text-white transition hover:bg-violet-500">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                  d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
              </svg>
              Add to Cart
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
